# Cloudflare named-tunnel config for Tripwire. Copy to ~/.cloudflared/config.yml
# and replace the three <...> placeholders.
#
# Only the four endpoints the dashboard uses are published. Everything else —
# the internal /mcp/* tool-execution API, /mcp/events and the legacy page —
# gets a 404 at Cloudflare and never reaches the Mac. Nothing routes to Ollama.
tunnel: <TUNNEL-ID>
credentials-file: <HOME>/.cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: <BACKEND-HOSTNAME>          # e.g. tripwire-api.yourdomain.com
    path: ^/(healthz|dashboard/stream|run|run/status)$
    service: http://127.0.0.1:8000
  - service: http_status:404
